<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | CareerNify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/modules.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="logo"><div class="logo-mark">C</div><div class="logo-text">CareerNify</div></div>
        <nav class="nav">
          <a class="nav-item" href="dashboard.html"><span class="icon">◫</span> Dashboard</a>
          <a class="nav-item" href="career-intelligence.html"><span class="icon">✦</span> Career Intelligence</a>
          <a class="nav-item" href="skill-analysis.html"><span class="icon">▣</span> Skill Analysis</a>
          <a class="nav-item" href="learning-paths.html"><span class="icon">▤</span> Learning Paths</a>
          <a class="nav-item" href="mock-interviews.html"><span class="icon">◍</span> Mock Interviews</a>
          <a class="nav-item" href="job-recommendations.html"><span class="icon">⌁</span> Job Recommendations</a>
          <a class="nav-item" href="placement-drives.html"><span class="icon">◌</span> Placement Drives</a>
          <a class="nav-item" href="assessments.html"><span class="icon">◫</span> Assessments</a>
          <a class="nav-item" href="certificates.html"><span class="icon">✓</span> Certificates</a>
          <a class="nav-item active" href="profile.html"><span class="icon">⚙</span> Settings</a>
          <a class="nav-item" href="support.html"><span class="icon">?</span> Help &amp; Support</a>
        </nav>
      </aside>
      <main class="main-panel">
        <header class="topbar"><div class="search"><span>⌕</span><input type="text" placeholder="Search profile" /></div><div class="topbar-actions"><button class="icon-btn" type="button">🔔</button><div class="user-badge"><div class="avatar" id="userAvatar">S</div><strong id="userName">Student</strong></div><button id="logoutBtn" class="btn btn-ghost" type="button" style="margin-left: 10px;">Logout</button></div></header>
        <div class="page-body"><div class="page-header"><div><h1>Profile &amp; Settings</h1><p>Update your details and preferences.</p></div><button class="btn btn-primary" type="submit" form="profileForm">Save Changes</button></div>
        <div class="content-panel"><form id="profileForm"><div class="form-grid"><div class="field"><label for="fullName">Full name</label><input id="fullName" type="text" value="Student Name" /></div><div class="field"><label for="email">Email</label><input id="email" type="email" value="student@example.com" /></div><div class="field"><label for="college">College</label><input id="college" type="text" value="ABC Institute" /></div><div class="field"><label for="preferredRole">Preferred Role</label><input id="preferredRole" type="text" value="Full-Stack Developer" /></div></div></form></div></div>
      </main>
    </div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/profile.js"></script>
  </body>
</html>
