<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password | CareerNify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="auth-layout">
      <main class="auth-card">
        <div class="auth-header">
          <h1>Create new password</h1>
          <p>Choose a new password for your account.</p>
        </div>
        <form id="resetPasswordForm">
          <div class="field" style="margin-bottom: 18px;">
            <label for="password">New password</label>
            <input id="password" type="password" placeholder="Enter new password" required />
          </div>
          <button class="btn btn-primary" type="submit" style="width: 100%;">Update password</button>
        </form>
      </main>
    </div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/reset-password.js"></script>
  </body>
</html>
