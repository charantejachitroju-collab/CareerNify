<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | CareerNify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="auth-layout">
      <main class="auth-card">
        <div class="auth-header">
          <h1>Forgot Passport?</h1>
          <p>We'll email a reset link to your account.</p>
        </div>
        <form id="forgotPasswordForm">
          <div class="field" style="margin-bottom: 18px;">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="name@example.com" required />
          </div>
          <button class="btn btn-primary" type="submit" style="width: 100%;">Send reset link</button>
        </form>
        <p style="margin-top: 18px; color: var(--muted); text-align: center;"><a href="login.html" class="muted-link">Back to login</a></p>
      </main>
    </div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/forgot-password.js"></script>
  </body>
</html>
